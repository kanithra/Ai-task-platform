name: CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/ai-task

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: cd backend && npm ci

      - name: Lint backend
        run: cd backend && npm run lint || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint worker (flake8)
        run: |
          pip install flake8
          cd worker && flake8 worker.py --max-line-length=120 || true

  # ── Build & Push ─────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push'
    outputs:
      image-tag: ${{ steps.meta.outputs.short-sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "short-sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Backend
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.short-sha }}
            ${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Worker
      - name: Build & Push Worker
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-worker:${{ steps.meta.outputs.short-sha }}
            ${{ env.IMAGE_PREFIX }}-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.short-sha }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Update Infra Repo ─────────────────────────────────────────────────────────
  update-infra:
    name: Update Infra Repository
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Infra Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.INFRA_REPO }}  # e.g. yourusername/ai-task-platform-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Update image tags in K8s manifests
        run: |
          TAG=${{ needs.build-and-push.outputs.image-tag }}
          REGISTRY=${{ secrets.DOCKERHUB_USERNAME }}

          # Update backend image tag
          sed -i "s|${REGISTRY}/ai-task-backend:.*|${REGISTRY}/ai-task-backend:${TAG}|g" \
            infra/k8s/base/backend.yaml

          # Update worker image tag
          sed -i "s|${REGISTRY}/ai-task-worker:.*|${REGISTRY}/ai-task-worker:${TAG}|g" \
            infra/k8s/base/worker.yaml

          # Update frontend image tag
          sed -i "s|${REGISTRY}/ai-task-frontend:.*|${REGISTRY}/ai-task-frontend:${TAG}|g" \
            infra/k8s/base/frontend.yaml

      - name: Commit and push changes
        run: |
          cd infra
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add k8s/base/
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ needs.build-and-push.outputs.image-tag }} [skip ci]"
          git push
