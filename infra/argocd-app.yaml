# Store this in your INFRA repository (separate repo for GitOps)
# Apply with: kubectl apply -f argocd-app.yaml -n argocd

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-task-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # ⚠️ Update to your infra repo URL
    repoURL: https://github.com/yourusername/ai-task-platform-infra
    targetRevision: HEAD
    path: k8s/overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: ai-task-platform

  syncPolicy:
    automated:
      prune: true        # Remove resources deleted from Git
      selfHeal: true     # Revert manual changes to match Git
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m

---
# Staging application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-task-platform-staging
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/yourusername/ai-task-platform-infra
    targetRevision: HEAD
    path: k8s/overlays/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: ai-task-platform-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
